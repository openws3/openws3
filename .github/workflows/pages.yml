# Publishes build/openws3.html (the web tool with the firmware inside) as the site root.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # the build id comes from git
      - run: sudo apt-get update && sudo apt-get install -y sdcc
      - run: make
      - run: mkdir site && cp build/openws3.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
